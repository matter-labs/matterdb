[workspace]
resolver = "3"
members = [
  "derive",
  "matterdb",
]

[workspace.package]
version = "2.0.0-pre"
edition = "2024"
rust-version = "1.85.0"
authors = [
  "The Exonum Team <contact@exonum.com>",
  "The Matter Labs Team <hello@matterlabs.dev>",
]
repository = "https://github.com/matter-labs/matterdb"
license = "Apache-2.0"
keywords = ["rocksdb", "database", "typesafe"]
categories = ["data-structures", "database"]

[workspace.dependencies]
# External dependencies; FIXME: update all
anyhow = "1.0"
byteorder = "1.3"
chrono = "0.4.6"
crossbeam = "0.8.0"
rocksdb = "0.24.0"
rust_decimal = "1.0"
serde = "1.0"
smallvec = "1.6"
thiserror = "1.0"
uuid = "0.8"
assert_matches = "1.3"
bincode = "1.3"
criterion = "0.3"
modifier = "0.1"
proptest = "1.0"
pretty_assertions = "0.7"
rand = "0.8"
rand_xorshift = "0.3.0"
url = "2.0"
tempfile = "3.2"
proc-macro2 = "1.0"
quote = "1.0"
syn = "2.0"

# Workspace dependencoes
matterdb-derive = { version = "=2.0.0-pre", path = "derive" }

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
module_name_repetitions = "allow"
